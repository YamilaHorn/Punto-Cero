<!DOCTYPE html>
<!-- Coding By CodingNepal - codingnepalweb.com -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medias</title>
    <link rel="stylesheet" href="css/swiper-bundle.min.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container swiper">
      <div class="slide-container">
        <div class="card-wrapper swiper-wrapper">
          <div class="card swiper-slide">
            <div class="image-box">
              <img
                src="images/medias/mediascalcioadulto.webp"
                alt="Botín Adidas F50"
                class="boot-image"
              />
            </div>
            <div class="profile-details">
              <div class="name-job">
                <h3 class="name">Medias Antideslizantes Calcio</h3>
                <h4 class="job size-info">Adultos</h4>
                <p class="price">$9.000</p>
              </div>
            </div>
            <div class="selectors">
              <label for="color-select">Color:</label>
              <select class="color-select" onchange="onSelectChange(this)">
                <option data-img="mediascalcioadulto.webp" data-size="Adultos">
                  Negro
                </option>
                <option data-img="mediascalcioadultoblancas.webp" data-size="Adultos">
                  Blanco
                </option>
              </select>
            </div>
          </div>
          <div class="card swiper-slide">
            <div class="image-box">
              <img src="images/medias/mediascalcioniñosblanca.webp" alt="Botín Adidas F50" class="boot-image" />
            </div>
            <div class="profile-details">
              <div class="name-job">
                <h3 class="name">Medias Antideslizantes Calcio</h3>
                <h4 class="job size-info">Niños</h4>
                <p class="price">$9.000</p>
              </div>
            </div>
            <div class="selectors">
              <label for="color-select">Color:</label>
              <select class="color-select" onchange="onSelectChange(this)">
                <option data-img="mediascalcioniños.webp" data-size="Niños">
                  Blanco 
                </option>
              </select>
            </div>
          </div>
          <div class="card swiper-slide">
            <div class="image-box">
              <img
                src="images/medias/mediascalcioeconomicas.webp"
                alt="Botín Adidas F50"
                class="boot-image"
              />
            </div>
            <div class="profile-details">
              <div class="name-job">
                <h3 class="name">Medias Antideslizantes Calcio Básicas</h3>
                <h4 class="job size-info">Adultos</h4>
                <p class="price">$5.000</p>
              </div>
            </div>
            <div class="selectors">
              <label for="color-select">Color:</label>
              <select class="color-select" onchange="onSelectChange(this)">
                <option data-img="mediascalcioeconomicas.webp" data-size="Adultos">
                  Negro
                </option>
              </select>
            </div>
          </div>
          <div class="card swiper-slide">
            <div class="image-box">
              <img src="images/medias/canillerablanca.webp" alt="Botín Adidas F50" class="boot-image" />
            </div>
            <div class="profile-details">
              <div class="name-job">
                <h3 class="name">Pantorrileras Calcio</h3>
                <h4 class="job size-info">Adultos</h4>
                <p class="price">$7.500</p>
              </div>
            </div>
            <div class="selectors">
              <label for="color-select">Color:</label>
              <select class="color-select" onchange="onSelectChange(this)">
                <option data-img="canillerablanca.webp" data-size="Adultos">
                  Blanco
                </option>
                 <option data-img="canilleraamarilla.webp" data-size="Adultos">
                  Amarillo
                </option>
              </select>
            </div>
          </div>
        </div>
      </div>
      <!-- <div class="swiper-button-next swiper-navBtn"></div>
      <div class="swiper-button-prev swiper-navBtn"></div>
      <div class="swiper-pagination"></div> -->
    </div>

    <div class="back-wrapper">
      <a href="stock.html" class="back-button">Volver al menú</a>
    </div>
    <script src="js/swiper-bundle.min.js"></script>
    <script src="js/script.js"></script>
    <script>
      function onSelectChange(select) {
        const selectedOption = select.options[select.selectedIndex];
        const imgName = selectedOption.getAttribute("data-img");
        const sizes = selectedOption.getAttribute("data-size");

        const card = select.closest(".card");
        const img = card.querySelector(".boot-image");
        const sizeText = card.querySelector(".size-info");

        img.src = `images/medias/${imgName}`;
        sizeText.textContent = sizes;
      }
    </script>
  </body>
</html>
