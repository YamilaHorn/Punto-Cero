<!DOCTYPE html>
<!-- Coding By CodingNepal - codingnepalweb.com -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canilleras</title>
    <link rel="stylesheet" href="css/swiper-bundle.min.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container swiper">
      <div class="slide-container">
        <div class="card-wrapper swiper-wrapper">
          <div class="card swiper-slide">
            <div class="image-box">
              <img
                src="images/"
                alt="Botín Adidas F50"
                class="boot-image"
              />
            </div>
            <div class="profile-details">
            <img src="images/profile/adidas.png" alt="logo adidas" />
              <div class="name-job">
                <h3 class="name">Adidas Guard</h3>
                <h4 class="job size-info">Adultos</h4>
                <p class="price">$15.000</p>
              </div>
            </div>
            <div class="selectors">
              <label for="color-select">Color:</label>
              <select class="color-select" onchange="onSelectChange(this)">
                <option data-img=".webp" data-size="Adultos">
                  Negro
                </option>
                <option data-img=".webp" data-size="Adultos">
                  Blanco
                </option>
              </select>
            </div>
          </div>
          <div class="card swiper-slide">
            <div class="image-box">
              <img src="images/" alt="Botín Adidas F50" class="boot-image" />
            </div>
            <div class="profile-details">
                <img src="images/profile/adidas.png" alt="logo adidas" />
              <div class="name-job">
                <h3 class="name">Adidas X Shinguard</h3>
                <h4 class="job size-info">Adultos</h4>
                <p class="price">$15.000</p>
              </div>
            </div>
            <div class="selectors">
              <label for="color-select">Color:</label>
              <select class="color-select" onchange="onSelectChange(this)">
                <option data-img=".webp" data-size="Adultos">
                  Negro - Dorado
                </option>
              </select>
            </div>
          </div>
          <div class="card swiper-slide">
            <div class="image-box">
              <img
                src="images/"
                alt="Botín Adidas F50"
                class="boot-image"
              />
            </div>
            <div class="profile-details">
            <img src="images/profile/logoNike.png" alt="logo adidas" />
              <div class="name-job">
                <h3 class="name">Nike Mercurial</h3>
                <h4 class="job size-info">Adultos</h4>
                <p class="price">$15.000</p>
              </div>
            </div>
            <div class="selectors">
              <label for="color-select">Color:</label>
              <select class="color-select" onchange="onSelectChange(this)">
                <option data-img=".webp" data-size="Adultos">
                  Amarillo
                </option>
                <option data-img=".webp" data-size="Adultos">
                  Blanco - Amarillo
                </option>
                <option data-img=".webp" data-size="Adultos">
                  Celeste - Rojo
                </option>
                <option data-img=".webp" data-size="Adultos">
                  Violeta - Rojo
                </option>
              </select>
            </div>
          </div>
        </div>
      </div>
      <!-- <div class="swiper-button-next swiper-navBtn"></div>
      <div class="swiper-button-prev swiper-navBtn"></div>
      <div class="swiper-pagination"></div> -->
    </div>

    <div class="back-wrapper">
      <a href="stock.html" class="back-button">Volver al menú</a>
    </div>
    <script src="js/swiper-bundle.min.js"></script>
    <script src="js/script.js"></script>
    <script>
      function onSelectChange(select) {
        const selectedOption = select.options[select.selectedIndex];
        const imgName = selectedOption.getAttribute("data-img");
        const sizes = selectedOption.getAttribute("data-size");

        const card = select.closest(".card");
        const img = card.querySelector(".boot-image");
        const sizeText = card.querySelector(".size-info");

        img.src = `images/F5/Nike/${imgName}`;
        sizeText.textContent = sizes;
      }
    </script>
  </body>
</html>
